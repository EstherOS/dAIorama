[package]
name = "daiorama"
version = "0.1.0"
edition = "2024"

[dependencies]
# Exact pins (P2 phase 1, contract layer). Version bumps are deliberate commits.
clap = { version = "=4.6.7", features = ["derive"] }
libc = "=0.2.190"
ron = "=0.12.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "signal", "time"] }
uuid = { version = "=1.28.0", features = ["v4"] }

[dev-dependencies]
ron = "=0.12.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "signal", "time"] }
