[workspace]
members = [".", "dashboard"]

[package]
name = "daiorama"
version = "0.1.0"
edition = "2024"

[dependencies]
# Exact pins (P2 phase 1, contract layer). Version bumps are deliberate commits.
clap = { version = "=4.6.7", features = ["derive"] }
libc = "=0.2.190"
ron = "=0.12.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# P5 input: in-binary virtual input over the session's own Wayland socket. Pure-Rust
# backend (no libwayland link; static-binary posture), protocol crates exact-pinned.
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "unstable"] }
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "signal", "sync", "time"] }
uuid = { version = "=1.28.0", features = ["v4"] }
# P5 dashboard install: the release asset is a gzipped tar, unpacked by us so every entry is
# checked (relative, file-or-directory) instead of trusting a shelled-out tar.
flate2 = "=1.1.2"
tar = "=0.4.44"
# 09 C2: release manifest signatures are verified in-process with a pure-Rust verifier, never a
# shelled-out minisign (a verifier that trusts an external binary is a weaker trust story).
minisign-verify = "=0.3.0"

[dev-dependencies]
ron = "=0.12.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# P5 input: in-binary virtual input over the session's own Wayland socket. Pure-Rust
# backend (no libwayland link; static-binary posture), protocol crates exact-pinned.
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "unstable"] }
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
tempfile = "=3.27.0"
# Integration tests build their own release-asset tarballs for `dashboard install`.
flate2 = "=1.1.2"
tar = "=0.4.44"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "signal", "sync", "time", "test-util"] }
