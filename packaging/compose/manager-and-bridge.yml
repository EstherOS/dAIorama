# Full local stack: manager plus the network bridge on one private compose network.
# Before the first start, in the /config volume: daiorama config set manager.bind 0.0.0.0:8756
services:
  manager:
    image: ${DAIORAMA_IMAGE:?set a digest-pinned daiorama core image}
    command: ["daiorama", "serve"]
    restart: unless-stopped
    # No published manager port: the bridge reaches it by service name on this network.
    volumes:
      - ${DAIORAMA_CONFIG:?}:/config
      - ${DAIORAMA_DATA:?}:/data
      # Per-session limits need a writable, delegated cgroupfs (06). Hosts that cannot
      # delegate: drop this mount and set limits.mode off; the manager reports limits off.
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    devices:
      - /dev/dri/renderD128
    group_add: ["keep-groups"]
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    cgroup: host

  bridge:
    image: ${DAIORAMA_IMAGE:?set a digest-pinned daiorama core image}
    # The bridge carries no session stack; it relays to the manager over this network.
    command: ["daiorama", "mcp", "--listen", "0.0.0.0:8757", "--remote", "manager:8756"]
    restart: unless-stopped
    depends_on:
      - manager
    ports:
      - "127.0.0.1:8757:8757"
    # DAIORAMA_TOKEN, DAIORAMA_SCOPE and DAIORAMA_SCOPE_TOKEN for the bridge process (04, 07).
    env_file:
      - ./bridge.env
    volumes:
      - ${DAIORAMA_CONFIG:?}:/config
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
